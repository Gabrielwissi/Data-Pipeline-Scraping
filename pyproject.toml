[project]

name = "Webscraping"
version = "0.0.1"
authors = [{ name = "ga76@hotmail.com" }]
requires-python = ">=3.10,<3.13"

dependencies = [
    "pandas",
    "selenium",
    "webdriver-manager",
    "openpyxl",
    "requests"
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
main = "Webscraping.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
