# This is a Databricks asset bundle definition for Webscraping.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Webscraping
  uuid: fb03d576-a007-4f1a-96b2-de381eb007bf

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405605511067219.19.azuredatabricks.net
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405605511067219.19.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ga76@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ga76@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: ga76@hotmail.com
        level: CAN_MANAGE
