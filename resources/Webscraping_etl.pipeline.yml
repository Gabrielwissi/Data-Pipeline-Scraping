# The main pipeline for Webscraping

resources:
  pipelines:
    Webscraping_etl:
      name: Webscraping_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/Webscraping_etl"

      libraries:
        - glob:
            include: ../src/Webscraping_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
